<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050817" />
  <title>SpaceGame — Nebula Run</title>
  <style>
    :root { color-scheme: dark; --cyan:#77e9ff; --violet:#9d8cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:#f6f7ff; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:radial-gradient(circle at 50% 20%,#18265e 0,#080b24 42%,#03040c 100%); }
    .shell { width:min(1180px,100%); height:100vh; margin:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; gap:12px; letter-spacing:.08em; text-transform:uppercase; }
    .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#07101d; font-weight:900; background:linear-gradient(135deg,var(--cyan),#d7b4ff); box-shadow:0 0 28px #77e9ff66; }
    .brand strong { font-size:14px; }.brand small { display:block; margin-top:3px; color:#9299bd; font-size:10px; letter-spacing:.16em; }
    .stats { display:flex; gap:9px; }.stat { min-width:92px; padding:8px 12px; border:1px solid #ffffff1c; border-radius:12px; background:#ffffff09; backdrop-filter:blur(12px); }.stat span { display:block; color:#858daf; font-size:10px; text-transform:uppercase; letter-spacing:.12em; }.stat b { display:block; margin-top:2px; color:var(--cyan); font-size:18px; }
    .stage { position:relative; flex:1; min-height:0; overflow:hidden; border:1px solid #ffffff20; border-radius:24px; background:#02030a; box-shadow:0 26px 90px #0008, inset 0 0 80px #2842a31c; }
    canvas { display:block; width:100%; height:100%; }.stage::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:24px; box-shadow:inset 0 0 80px #000b, inset 0 0 2px #ffffff88; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:24px; background:linear-gradient(180deg,#05081644,#050816b8); text-align:center; transition:.25s ease; }.overlay.hidden { opacity:0; pointer-events:none; transform:scale(1.03); }
    .panel { width:min(460px,100%); padding:30px; border:1px solid #ffffff2b; border-radius:24px; background:#0d1025cc; box-shadow:0 20px 70px #0008, 0 0 50px #7165ff22; backdrop-filter:blur(20px); }.eyebrow { margin:0 0 8px; color:var(--cyan); font-size:11px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(32px,6vw,64px); line-height:.95; letter-spacing:-.06em; }.panel p { color:#b4badb; line-height:1.65; }
    .primary { border:0; border-radius:999px; padding:13px 22px; color:#06101b; background:linear-gradient(100deg,var(--cyan),#c1a5ff); font:inherit; font-weight:800; cursor:pointer; box-shadow:0 0 28px #77e9ff45; }.primary:hover { filter:brightness(1.1); transform:translateY(-1px); }.help { margin-top:16px !important; font-size:12px; color:#858daf !important; }
    .touch { position:absolute; bottom:18px; display:flex; gap:10px; opacity:0; pointer-events:none; }.touch button { width:54px; height:44px; border:1px solid #ffffff2d; border-radius:14px; color:#dbe9ff; background:#0c1332cc; font-size:18px; }.touch.left { left:18px; }.touch.right { right:18px; }
    @media (max-width:700px) { .shell{padding:12px;gap:10px}.stats{gap:5px}.stat{min-width:70px;padding:7px 8px}.stat b{font-size:15px}.touch{opacity:1;pointer-events:auto}.panel{padding:24px 18px} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><strong>SpaceGame</strong><small>NEBULA RUN / SURVIVAL PROTOCOL</small></div></div><div class="stats"><div class="stat"><span>survival</span><b id="timer">00:00</b></div><div class="stat"><span>score</span><b id="score">0000</b></div></div></header>
    <section class="stage" id="stage"><canvas id="gameCanvas" aria-label="SpaceGame canvas"></canvas><div class="overlay" id="overlay"><div class="panel"><p class="eyebrow">deep space / sector 07</p><h1 id="overlayTitle">Nebula Run</h1><p id="overlayText">운석 지대를 통과하며 최대한 오래 생존하세요.</p><button class="primary" id="startButton">미션 시작</button><p class="help">← → 또는 A / D 이동 · Space 미사일 · 모바일은 화면 버튼</p></div></div><div class="touch left"><button data-key="ArrowLeft" aria-label="왼쪽 이동">←</button></div><div class="touch right"><button data-key="ArrowRight" aria-label="오른쪽 이동">→</button></div></section>
  </main>
  <script>
    const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),startButton=document.getElementById('startButton'),timerEl=document.getElementById('timer'),scoreEl=document.getElementById('score');
    const state={playing:false,start:0,elapsed:0,score:0,last:0,spawn:0,dpr:1},keys=new Set(),ship={x:0,y:0,radius:24,speed:430};let stars=[],rocks=[],shots=[],particles=[];
    function resize(){const r=stage.getBoundingClientRect();state.dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*state.dpr;canvas.height=r.height*state.dpr;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(state.dpr,0,0,state.dpr,0,0);ship.y=r.height-74;if(!ship.x)ship.x=r.width/2}function width(){return stage.clientWidth}function height(){return stage.clientHeight}function fmt(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=Math.floor(sec%60).toString().padStart(2,'0');return `${m}:${s}`}
    function reset(){state.elapsed=0;state.score=0;state.spawn=0;ship.x=width()/2;ship.y=height()-74;rocks=[];shots=[];particles=[];stars=Array.from({length:170},()=>({x:Math.random(),y:Math.random(),z:.15+Math.random()*.85,r:Math.random()*1.7+.25}));timerEl.textContent='00:00';scoreEl.textContent='0000'}function begin(){reset();state.playing=true;state.start=performance.now();state.last=state.start;overlay.classList.add('hidden')}function end(){state.playing=false;overlayTitle.textContent='Signal Lost';overlayText.textContent=`생존 시간 ${fmt(state.elapsed)} · 점수 ${state.score.toString().padStart(4,'0')}`;startButton.textContent='다시 시작';overlay.classList.remove('hidden')}
    function spawnRock(){rocks.push({x:Math.random()*width(),y:-50,r:13+Math.random()*23,z:.6+Math.random()*.8,speed:95+Math.random()*95+state.elapsed*2,spin:Math.random()*6.28})}function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:.5+Math.random()*.4,color})}function projectStar(s,dt){s.y+=dt*(.03+.12*s.z);if(s.y>1){s.y=0;s.x=Math.random()}}
    function drawSpace(dt){const w=width(),h=height(),g=ctx.createRadialGradient(w*.5,h*.25,2,w*.5,h*.45,h*.9);g.addColorStop(0,'#172257');g.addColorStop(.5,'#080d2e');g.addColorStop(1,'#02030a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';stars.forEach(s=>{projectStar(s,dt);ctx.fillStyle=`rgba(176,220,255,${.35+.55*s.z})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r*s.z,0,Math.PI*2);ctx.fill()});ctx.globalCompositeOperation='source-over';const horizon=h*.66;ctx.strokeStyle='#77e9ff18';ctx.lineWidth=1;for(let i=1;i<12;i++){const y=horizon+Math.pow(i/11,1.7)*(h-horizon+70);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(w/2+i*18,horizon);ctx.lineTo(w/2+i*110,h);ctx.stroke()}ctx.fillStyle='#77e9ff0d';ctx.fillRect(0,horizon,w,1)}
    function drawRock(r){const grad=ctx.createRadialGradient(r.x-r.r*.35,r.y-r.r*.45,1,r.x,r.y,r.r*1.2);grad.addColorStop(0,'#f3b1ff');grad.addColorStop(.35,'#8c5aad');grad.addColorStop(1,'#261d4d');ctx.fillStyle=grad;ctx.shadowColor='#c778ff66';ctx.shadowBlur=18;ctx.beginPath();for(let i=0;i<9;i++){const a=i*Math.PI*2/9,rr=r.r*(.78+Math.sin(i*8.3+r.spin)*.18),x=r.x+Math.cos(a)*rr,y=r.y+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.shadowBlur=0}
    function drawShip(){const x=ship.x,y=ship.y;ctx.save();ctx.translate(x,y);ctx.shadowColor='#77e9ff';ctx.shadowBlur=28;const glow=ctx.createRadialGradient(0,11,2,0,11,34);glow.addColorStop(0,'#d7f8ff');glow.addColorStop(1,'#3cd9ff00');ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(0,13,30,12,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#b7f5ff';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(24,10);ctx.quadraticCurveTo(0,20,-24,10);ctx.closePath();ctx.fill();ctx.fillStyle='#5362d9';ctx.beginPath();ctx.ellipse(0,-5,13,8,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#efffff';ctx.beginPath();ctx.ellipse(0,-7,8,5,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9fdc';ctx.beginPath();ctx.ellipse(0,14,12,5,0,0,Math.PI*2);ctx.fill();ctx.restore()}
    function update(dt){if(!state.playing)return;state.elapsed=(performance.now()-state.start)/1000;timerEl.textContent=fmt(state.elapsed);scoreEl.textContent=Math.floor(state.elapsed*10+state.score).toString().padStart(4,'0');const dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);ship.x=Math.max(ship.radius,Math.min(width()-ship.radius,ship.x+dir*ship.speed*dt));state.spawn-=dt;if(state.spawn<=0){spawnRock();state.spawn=Math.max(.22,.8-state.elapsed*.008)}rocks.forEach(r=>{r.y+=r.speed*dt;r.spin+=dt});shots.forEach(s=>s.y-=650*dt);for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];if(r.y>height()+60){rocks.splice(i,1);continue}if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+ship.radius*.55){burst(ship.x,ship.y,'#ff8dcc');end();return}}for(let i=shots.length-1;i>=0;i--){if(shots[i].y<-30){shots.splice(i,1);continue}for(let j=rocks.length-1;j>=0;j--){if(Math.hypot(shots[i].x-rocks[j].x,shots[i].y-rocks[j].y)<rocks[j].r+5){burst(rocks[j].x,rocks[j].y,'#8df5ff');rocks.splice(j,1);shots.splice(i,1);state.score+=25;break}}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
    function render(dt){drawSpace(dt);rocks.forEach(drawRock);ctx.save();ctx.shadowColor='#ffea7a';ctx.shadowBlur=18;shots.forEach(s=>{ctx.fillStyle='#fff4a8';ctx.fillRect(s.x-2,s.y-14,4,18)});ctx.restore();drawShip();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}function loop(now){const dt=Math.min(.04,(now-state.last)/1000||0);state.last=now;update(dt);render(dt);requestAnimationFrame(loop)}function fire(){if(state.playing)shots.push({x:ship.x,y:ship.y-28})}
    window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key===' '){e.preventDefault();if(!state.playing)begin();else fire()}});window.addEventListener('keyup',e=>keys.delete(e.key));startButton.addEventListener('click',begin);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',()=>keys.add(k));b.addEventListener('pointerup',()=>keys.delete(k));b.addEventListener('pointerleave',()=>keys.delete(k))});canvas.addEventListener('pointerdown',()=>{if(!state.playing)begin()});resize();reset();requestAnimationFrame(loop);
  </script>
</body>
</html>
