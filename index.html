<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#03040d" />
  <title>SpaceGame — Nebula Run 3D</title>
  <style>
    :root{color-scheme:dark;--cyan:#78efff;--pink:#ff80d4;--ink:#050611}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7ff}.app{width:100%;height:100%;position:relative;background:radial-gradient(circle at 50% 15%,#202d70 0,#080b22 44%,#02030a 100%)}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,#02030ab8 100%);mix-blend-mode:multiply}.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.brand{display:flex;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.1em}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff44;border-radius:14px;background:linear-gradient(135deg,#78efff,#b08bff);color:#071021;font-weight:900;box-shadow:0 0 30px #78efff66}.brand strong{display:block;font-size:14px}.brand small{display:block;margin-top:4px;color:#8f9bc7;font-size:10px;letter-spacing:.2em}.meters{display:flex;gap:9px}.meter{min-width:105px;padding:9px 12px;border:1px solid #ffffff20;border-radius:13px;background:#090d22aa;backdrop-filter:blur(12px)}.meter span{display:block;color:#8f9bc7;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.meter b{display:block;margin-top:2px;color:var(--cyan);font-size:19px}.bottom{display:flex;justify-content:space-between;align-items:end;color:#aab2d8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.hint{padding:9px 13px;border:1px solid #ffffff18;border-radius:999px;background:#080b1dcc;backdrop-filter:blur(12px)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#04051158;transition:.3s ease;text-align:center}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(510px,100%);padding:34px;border:1px solid #ffffff32;border-radius:28px;background:linear-gradient(145deg,#111936dc,#080b1dcc);box-shadow:0 25px 100px #000b,0 0 70px #5367ff26;backdrop-filter:blur(22px)}.eyebrow{margin:0 0 10px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}.panel h1{margin:0;font-size:clamp(42px,9vw,82px);line-height:.88;letter-spacing:-.075em}.panel p:not(.eyebrow):not(.help){color:#c2c8e7;line-height:1.7}.primary{border:0;border-radius:999px;padding:14px 25px;color:#050817;background:linear-gradient(100deg,var(--cyan),#c4a4ff);font:inherit;font-weight:850;cursor:pointer;box-shadow:0 0 34px #78efff4d;transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.1)}.help{margin:18px 0 0!important;color:#8993bb!important;font-size:12px}.touch{position:absolute;bottom:25px;display:none;gap:10px;pointer-events:auto}.touch button{width:58px;height:48px;border:1px solid #ffffff2d;border-radius:15px;color:#dffaff;background:#090f2bcc;font-size:20px}.left{left:24px}.right{right:24px}@media(max-width:700px){.hud{padding:14px}.meters{gap:5px}.meter{min-width:73px;padding:7px 8px}.meter b{font-size:15px}.bottom{display:none}.touch{display:flex}.panel{padding:27px 20px}}
  </style>
</head>
<body>
  <main class="app"><canvas id="scene"></canvas><div class="vignette"></div><section class="hud"><div class="top"><div class="brand"><div class="mark">✦</div><div><strong>SpaceGame</strong><small>NEBULA RUN / 3D SURVIVAL</small></div></div><div class="meters"><div class="meter"><span>survival</span><b id="timer">00:00</b></div><div class="meter"><span>score</span><b id="score">0000</b></div></div></div><div class="bottom"><div class="hint">← → / A D · SPACE FIRE</div><div>SECTOR 07 · LIVE</div></div></section><div class="overlay" id="overlay"><div class="panel"><p class="eyebrow">deep space / sector 07</p><h1 id="title">Nebula Run</h1><p id="message">실제 3D 우주를 가로지르며 운석 지대를 돌파하세요.</p><button class="primary" id="start">미션 시작</button><p class="help">← → 또는 A / D 이동 · Space 발사 · 모바일 버튼 지원</p></div></div><div class="touch left"><button data-key="ArrowLeft" aria-label="왼쪽 이동">←</button></div><div class="touch right"><button data-key="ArrowRight" aria-label="오른쪽 이동">→</button></div></main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    const canvas=document.getElementById('scene'),app=document.querySelector('.app'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),timerEl=document.getElementById('timer'),scoreEl=document.getElementById('score');
    const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050817,.018);scene.background=new THREE.Color(0x03040d);
    const camera=new THREE.PerspectiveCamera(58,1,.1,160);camera.position.set(0,3.1,10);camera.lookAt(0,1,-16);
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
    scene.add(new THREE.HemisphereLight(0x8da8ff,0x120a2e,1.5));const key=new THREE.DirectionalLight(0xb9d7ff,2.5);key.position.set(-6,8,8);scene.add(key);const magenta=new THREE.PointLight(0xff4fc8,18,28);magenta.position.set(6,2,-16);scene.add(magenta);
    const state={playing:false,start:0,last:0,time:0,score:0,spawn:0};const keys=new Set();let asteroids=[],missiles=[],particles=[];
    function resize(){const w=app.clientWidth,h=app.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
    function makeStars(){const geo=new THREE.BufferGeometry(),pos=[];for(let i=0;i<1900;i++){pos.push((Math.random()-.5)*90,Math.random()*45-8,-Math.random()*120-8)}geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({color:0xbddcff,size:.12,sizeAttenuation:true,transparent:true,opacity:.85});scene.add(new THREE.Points(geo,mat))}makeStars();
    const planet=new THREE.Group();const planetMesh=new THREE.Mesh(new THREE.SphereGeometry(8,48,32),new THREE.MeshStandardMaterial({color:0x1b245c,roughness:.9,metalness:.05,emissive:0x101849,emissiveIntensity:.55}));planet.add(planetMesh);const ring=new THREE.Mesh(new THREE.RingGeometry(10,15,96),new THREE.MeshBasicMaterial({color:0x768cff,transparent:true,opacity:.18,side:THREE.DoubleSide}));ring.rotation.x=Math.PI*.62;planet.add(ring);planet.position.set(-18,7,-48);scene.add(planet);
    function makeShip(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.7,6),new THREE.MeshStandardMaterial({color:0x9eefff,metalness:.75,roughness:.2,emissive:0x174c70,emissiveIntensity:.65}));body.rotation.x=-Math.PI/2;g.add(body);const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),new THREE.MeshStandardMaterial({color:0xf7ffff,metalness:.2,roughness:.05,emissive:0x6de8ff,emissiveIntensity:1.3}));cockpit.scale.set(1,.55,.75);cockpit.position.set(0,.25,.05);g.add(cockpit);const wingMat=new THREE.MeshStandardMaterial({color:0x6e70dc,metalness:.8,roughness:.22,emissive:0x201d6b,emissiveIntensity:.6});[-1,1].forEach(side=>{const wing=new THREE.Mesh(new THREE.BoxGeometry(1.8,.12,.65),wingMat);wing.position.set(side*.78,0,.35);wing.rotation.y=side*.28;g.add(wing)});const flame=new THREE.Mesh(new THREE.ConeGeometry(.3,1.3,16),new THREE.MeshBasicMaterial({color:0xff72d1,transparent:true,opacity:.9}));flame.rotation.x=Math.PI/2;flame.position.z=.9;g.add(flame);g.userData.flame=flame;g.position.set(0,1.2,5);scene.add(g);return g}const ship=makeShip();
    const rockGeo=new THREE.IcosahedronGeometry(1,1),rockMat=new THREE.MeshStandardMaterial({color:0x68478e,roughness:.88,metalness:.12,emissive:0x241441,emissiveIntensity:.45});
    function spawn(){const mesh=new THREE.Mesh(rockGeo,rockMat.clone());const s=.55+Math.random()*1.3;mesh.scale.setScalar(s);mesh.position.set((Math.random()-.5)*18,Math.random()*7-1,-45);mesh.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(mesh);asteroids.push({mesh,radius:s*.9,speed:9+Math.random()*7+state.time*.08})}
    function fire(){if(!state.playing)return;const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.1,10),new THREE.MeshBasicMaterial({color:0xffe77b}));mesh.rotation.x=Math.PI/2;mesh.position.copy(ship.position);mesh.position.y+=.1;mesh.position.z-=1.5;scene.add(mesh);missiles.push({mesh,speed:32})}
    function burst(pos,color){for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.06,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({mesh,velocity:new THREE.Vector3((Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8),life:.5+Math.random()*.6})}}
    function fmt(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${Math.floor(n%60).toString().padStart(2,'0')}`}
    function reset(){asteroids.forEach(o=>scene.remove(o.mesh));missiles.forEach(o=>scene.remove(o.mesh));particles.forEach(o=>scene.remove(o.mesh));asteroids=[];missiles=[];particles=[];state.time=0;state.score=0;state.spawn=0;ship.position.set(0,1.2,5);ship.rotation.set(0,0,0);timerEl.textContent='00:00';scoreEl.textContent='0000'}function begin(){reset();state.playing=true;state.start=performance.now();state.last=state.start;overlay.classList.add('hidden');start.textContent='미션 시작'}function gameOver(){state.playing=false;title.textContent='Signal Lost';message.textContent=`생존 시간 ${fmt(state.time)} · 점수 ${state.score.toString().padStart(4,'0')}`;start.textContent='다시 시작';overlay.classList.remove('hidden')}
    function update(dt){if(!state.playing)return;state.time=(performance.now()-state.start)/1000;timerEl.textContent=fmt(state.time);scoreEl.textContent=Math.floor(state.score+state.time*10).toString().padStart(4,'0');const dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);ship.position.x=THREE.MathUtils.clamp(ship.position.x+dir*dt*11,-8.3,8.3);ship.rotation.z=THREE.MathUtils.lerp(ship.rotation.z,-dir*.22,.12);ship.userData.flame.scale.y=1+Math.random()*.55;state.spawn-=dt;if(state.spawn<=0){spawn();state.spawn=Math.max(.24,.72-state.time*.006)}asteroids.forEach(o=>{o.mesh.position.z+=o.speed*dt;o.mesh.rotation.x+=dt*1.3;o.mesh.rotation.y+=dt*.9});missiles.forEach(o=>o.mesh.position.z-=o.speed*dt);for(let i=asteroids.length-1;i>=0;i--){const o=asteroids[i];if(o.mesh.position.z>12){scene.remove(o.mesh);asteroids.splice(i,1);continue}if(o.mesh.position.distanceTo(ship.position)<o.radius+1.05){burst(ship.position,0xff65bd);gameOver();return}}for(let i=missiles.length-1;i>=0;i--){const shot=missiles[i];if(shot.mesh.position.z<-55){scene.remove(shot.mesh);missiles.splice(i,1);continue}for(let j=asteroids.length-1;j>=0;j--){const rock=asteroids[j];if(shot.mesh.position.distanceTo(rock.mesh.position)<rock.radius+.4){burst(rock.mesh.position,0x7cecff);scene.remove(shot.mesh);scene.remove(rock.mesh);missiles.splice(i,1);asteroids.splice(j,1);state.score+=25;break}}}particles.forEach(p=>{p.mesh.position.addScaledVector(p.velocity,dt);p.velocity.multiplyScalar(.96);p.life-=dt;p.mesh.scale.setScalar(Math.max(0,p.life*2))});particles=particles.filter(p=>{if(p.life<=0){scene.remove(p.mesh);return false}return true});camera.position.x=THREE.MathUtils.lerp(camera.position.x,ship.position.x*.08,.08);camera.lookAt(camera.position.x*.2,1,-18);planet.rotation.y+=dt*.025}
    function loop(now){const dt=Math.min(.05,(now-state.last)/1000||0);state.last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
    window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key===' '){e.preventDefault();if(!state.playing)begin();else fire()}});window.addEventListener('keyup',e=>keys.delete(e.key));start.addEventListener('click',begin);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',()=>keys.add(k));['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,()=>keys.delete(k)))});resize();reset();requestAnimationFrame(loop);
  </script>
</body>
</html>
