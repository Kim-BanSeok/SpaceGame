<body><main class="app"><canvas id="game"></canvas><section class="hud"><div class="top"><div class="brand"><div class="mark">✦</div><div><strong>SpaceGame</strong><small>NEBULA RUN / 2.5D SURVIVAL</small></div></div><div class="meters"><div class="meter"><span>survival</span><b id="time">00:00</b></div><div class="meter"><span>score</span><b id="score">0000</b></div><div class="meter"><span>hull</span><b id="hull">♥♥♥</b></div></div></div><div class="bottom"><div class="hint">← → / A D · SPACE FIRE</div><div>SECTOR 07 · LIVE</div></div></section><div class="overlay" id="overlay"><div class="panel"><p class="eyebrow">deep space / sector 07</p><h1 id="title">Nebula Run</h1><p id="message">운석 지대를 통과하며 최대한 오래 생존하세요.</p><button class="primary" id="start">미션 시작</button><p class="help">← → 또는 A / D 이동 · Space 발사 · 충돌 3회까지 생존</p></div></div><div class="touch left"><button data-key="ArrowLeft">←</button></div><div class="touch right"><button data-key="ArrowRight">→</button></div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),app=document.querySelector('.app'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),timeEl=document.getElementById('time'),scoreEl=document.getElementById('score'),hullEl=document.getElementById('hull');let W=0,H=0,dpr=1,stars=[],rocks=[],shots=[],sparks=[],keys=new Set();const s={play:false,start:0,last:0,t:0,score:0,hits:0,shield:0,spawn:0,shake:0},ship={x:0,y:0,r:24,speed:420};
function resize(){W=app.clientWidth;H=app.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ship.y=H-82;if(!ship.x)ship.x=W/2}function fmt(t){return`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`}function reset(){s.t=0;s.score=0;s.hits=0;s.shield=0;s.spawn=0;s.shake=0;ship.x=W/2;rocks=[];shots=[];sparks=[];stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),z:.2+Math.random()*.8,r:.4+Math.random()*1.6}));hud()}function hud(){timeEl.textContent=fmt(s.t);scoreEl.textContent=Math.floor(s.score+s.t*10).toString().padStart(4,'0');hullEl.textContent='♥'.repeat(Math.max(0,3-s.hits))+'♡'.repeat(s.hits)}function begin(){reset();s.play=true;s.start=performance.now();s.last=s.start;overlay.classList.add('hidden');title.textContent='Nebula Run';start.textContent='미션 시작'}function over(){s.play=false;title.textContent='Ship Damaged';message.textContent=`생존 시간 ${fmt(s.t)} · 점수 ${Math.floor(s.score+s.t*10)}`;start.textContent='다시 시작';overlay.classList.remove('hidden')}
function rock(){rocks.push({x:Math.random()*W,y:-40,r:13+Math.random()*22,z:.65+Math.random()*.7,vy:90+Math.random()*75+s.t*1.8,a:Math.random()*6.28})}function spark(px,py,color){for(let i=0;i<18;i++)sparks.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.4+Math.random()*.6,color})}function drawSpace(dt){const g=x.createRadialGradient(W*.5,H*.2,3,W*.5,H*.48,H);g.addColorStop(0,'#17245d');g.addColorStop(.52,'#080d2e');g.addColorStop(1,'#02030a');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';stars.forEach(a=>{a.y+=dt*(.025+.1*a.z);if(a.y>1){a.y=0;a.x=Math.random()}x.fillStyle=`rgba(180,225,255,${.3+.55*a.z})`;x.beginPath();x.arc(a.x*W,a.y*H,a.r*a.z,0,Math.PI*2);x.fill()});x.globalCompositeOperation='source-over';const hy=H*.67;x.strokeStyle='#7beeff18';for(let i=1;i<10;i++){const yy=hy+Math.pow(i/9,1.7)*(H-hy+65);x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}for(let i=-9;i<=9;i++){x.beginPath();x.moveTo(W/2+i*18,hy);x.lineTo(W/2+i*120,H);x.stroke()}x.fillStyle='#7beeff0c';x.fillRect(0,hy,W,1);x.fillStyle='#4d57a322';x.beginPath();x.arc(W*.78,H*.25,Math.min(W,H)*.22,0,Math.PI*2);x.fill()}
function drawRock(r){const g=x.createRadialGradient(r.x-r.r*.4,r.y-r.r*.5,1,r.x,r.y,r.r*1.2);g.addColorStop(0,'#edb8ff');g.addColorStop(.38,'#8d5aae');g.addColorStop(1,'#261b4d');x.fillStyle=g;x.shadowColor='#c778ff66';x.shadowBlur=16;x.beginPath();for(let i=0;i<9;i++){const a=i*Math.PI*2/9,rr=r.r*(.78+Math.sin(i*7.4+r.a)*.17),px=r.x+Math.cos(a)*rr,py=r.y+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.shadowBlur=0}
function drawShip(){const y=ship.y;x.save();x.translate(ship.x,y);if(s.shield>0){x.strokeStyle='#7beeffaa';x.lineWidth=3;x.shadowColor='#7beeff';x.shadowBlur=20;x.beginPath();x.ellipse(0,0,ship.r+12,ship.r+9,0,0,Math.PI*2);x.stroke();x.shadowBlur=0}const glow=x.createRadialGradient(0,14,2,0,14,34);glow.addColorStop(0,'#e3fbff');glow.addColorStop(1,'#3cd9ff00');x.fillStyle=glow;x.beginPath();x.ellipse(0,16,29,12,0,0,Math.PI*2);x.fill();x.fillStyle='#b8f6ff';x.beginPath();x.moveTo(0,-23);x.lineTo(25,10);x.quadraticCurveTo(0,21,-25,10);x.closePath();x.fill();x.fillStyle='#5665db';x.beginPath();x.ellipse(0,-6,13,8,0,Math.PI,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(0,-8,7,4,0,Math.PI,Math.PI*2);x.fill();x.fillStyle='#ff8ed8';x.beginPath();x.ellipse(0,15,11,5,0,0,Math.PI*2);x.fill();x.restore()}
function update(dt){if(!s.play)return;s.t=(performance.now()-s.start)/1000;s.shield=Math.max(0,s.shield-dt);s.shake=Math.max(0,s.shake-dt);const dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x+dir*ship.speed*dt));s.spawn-=dt;if(s.spawn<=0){rock();s.spawn=Math.max(.28,.78-s.t*.005)}rocks.forEach(r=>{r.y+=r.vy*dt;r.a+=dt});shots.forEach(q=>q.y-=620*dt);for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];if(r.y>H+60){rocks.splice(i,1);continue}if(s.shield<=0&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+ship.r*.36){s.hits++;s.shield=1.8;s.shake=.3;spark(ship.x,ship.y,'#ff77c9');rocks.splice(i,1);if(s.hits>=3){over();return}}}for(let i=shots.length-1;i>=0;i--){if(shots[i].y<-30){shots.splice(i,1);continue}for(let j=rocks.length-1;j>=0;j--){if(Math.hypot(shots[i].x-rocks[j].x,shots[i].y-rocks[j].y)<rocks[j].r+6){spark(rocks[j].x,rocks[j].y,'#7beeff');rocks.splice(j,1);shots.splice(i,1);s.score+=25;break}}}sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});sparks=sparks.filter(p=>p.life>0);hud()}
function render(dt){x.save();if(s.shake>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);drawSpace(dt);rocks.forEach(drawRock);x.save();x.shadowColor='#ffe66d';x.shadowBlur=15;shots.forEach(q=>{x.fillStyle='#fff2a1';x.fillRect(q.x-2,q.y-15,4,18)});x.restore();drawShip();sparks.forEach(p=>{x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill();x.globalAlpha=1});x.restore()}function loop(now){const dt=Math.min(.04,(now-s.last)/1000||0);s.last=now;update(dt);render(dt);requestAnimationFrame(loop)}function fire(){if(s.play)shots.push({x:ship.x,y:ship.y-25})}window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key===' '){e.preventDefault();s.play?fire():begin()}});window.addEventListener('keyup',e=>keys.delete(e.key));start.addEventListener('click',begin);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',()=>keys.add(k));['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e,()=>keys.delete(k)))});resize();reset();requestAnimationFrame(loop);
</script>
<script>
/* Fighter-style ship skin: keeps gameplay untouched and replaces only the visual layer. */
function drawShip(){
  const y=ship.y, dir=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);
  x.save(); x.translate(ship.x,y); x.rotate(dir*.09);
  if(s.shield>0){x.strokeStyle='#7beeffbb';x.lineWidth=2.5;x.shadowColor='#7beeff';x.shadowBlur=22;x.beginPath();x.ellipse(0,0,ship.r+14,ship.r+10,0,0,Math.PI*2);x.stroke();x.shadowBlur=0}
  x.globalCompositeOperation='lighter';
  [-11,11].forEach((ex,i)=>{const flame=x.createLinearGradient(ex,15,ex,34);flame.addColorStop(0,i?'#fff2a1':'#b8f8ff');flame.addColorStop(.35,i?'#ff9c60':'#6beaff');flame.addColorStop(1,'rgba(255,93,202,0)');x.fillStyle=flame;x.beginPath();x.moveTo(ex-4,12);x.quadraticCurveTo(ex,26+Math.random()*7,ex+4,12);x.closePath();x.fill()});
  x.globalCompositeOperation='source-over'; x.shadowColor='#7beeff88';x.shadowBlur=18;
  const wing=x.createLinearGradient(-30,-2,30,15);wing.addColorStop(0,'#313c9b');wing.addColorStop(.5,'#b6f5ff');wing.addColorStop(1,'#313c9b');x.fillStyle=wing;x.beginPath();x.moveTo(-5,-3);x.lineTo(-31,13);x.lineTo(-12,15);x.lineTo(-4,8);x.closePath();x.fill();x.beginPath();x.moveTo(5,-3);x.lineTo(31,13);x.lineTo(12,15);x.lineTo(4,8);x.closePath();x.fill();
  x.fillStyle='#d9fbff';x.beginPath();x.moveTo(0,-27);x.lineTo(12,5);x.quadraticCurveTo(10,17,0,20);x.quadraticCurveTo(-10,17,-12,5);x.closePath();x.fill();
  x.fillStyle='#5969e4';x.beginPath();x.moveTo(-8,10);x.lineTo(-15,21);x.lineTo(-3,17);x.closePath();x.fill();x.beginPath();x.moveTo(8,10);x.lineTo(15,21);x.lineTo(3,17);x.closePath();x.fill();
  const glass=x.createLinearGradient(0,-21,0,2);glass.addColorStop(0,'#f7ffff');glass.addColorStop(.4,'#63e5ff');glass.addColorStop(1,'#3346a6');x.fillStyle=glass;x.beginPath();x.ellipse(0,-8,7.5,10,0,0,Math.PI*2);x.fill();x.strokeStyle='#d8ffff';x.lineWidth=1;x.stroke();
  x.shadowBlur=0;x.fillStyle='#ff8ed8';[-7,7].forEach(l=>{x.beginPath();x.arc(l,12,2,0,Math.PI*2);x.fill()});x.restore();
}
</script>
<script>
/* Faceted asteroid skin: visual-only override. */
function drawRock(r){
  x.save(); x.translate(r.x,r.y); x.rotate(r.a);
  const pulse=.5+.5*Math.sin(r.a*1.7), rim=x.createRadialGradient(-r.r*.38,-r.r*.5,1,r.r*.1,r.r*.15,r.r*1.15);
  rim.addColorStop(0,'#ffe1ff');rim.addColorStop(.18,'#d98dce');rim.addColorStop(.48,pulse>.55?'#8b4f9f':'#714c9c');rim.addColorStop(1,'#1d173f');x.fillStyle=rim;x.shadowColor='#ba68e866';x.shadowBlur=18;
  x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI*2/10,rr=r.r*(.76+Math.sin(i*5.9+r.a)*.18),px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.shadowBlur=0;
  x.strokeStyle='#ffc0ee55';x.lineWidth=1.2;x.stroke();
  const craters=[[-.35,-.28,.16],[.28,-.05,.12],[-.08,.36,.2]];craters.forEach((q,i)=>{const cg=x.createRadialGradient(q[0]*r.r-.04*r.r,q[1]*r.r-.05*r.r,1,q[0]*r.r,q[1]*r.r,q[2]*r.r);cg.addColorStop(0,'#24163e');cg.addColorStop(.7,'#4b2a6b');cg.addColorStop(1,'#bd75bc55');x.fillStyle=cg;x.beginPath();x.arc(q[0]*r.r,q[1]*r.r,q[2]*r.r,0,Math.PI*2);x.fill()});
  x.globalCompositeOperation='lighter';x.fillStyle='#ffb26f99';x.beginPath();x.arc(-r.r*.45,r.r*.28,Math.max(1.5,r.r*.055),0,Math.PI*2);x.fill();x.fillStyle='#9deaff99';x.beginPath();x.arc(r.r*.34,-r.r*.35,Math.max(1,r.r*.045),0,Math.PI*2);x.fill();x.restore();
}
</script>
<script>

const storyBanner=document.createElement('div');storyBanner.className='story-banner';app.appendChild(storyBanner);let storyTimer;

function showStory(label,text){storyBanner.innerHTML='<b>'+label+'</b>'+text;storyBanner.classList.add('show');clearTimeout(storyTimer);storyTimer=setTimeout(()=>storyBanner.classList.remove('show'),5200)}
const baseBegin=begin,baseOver=over;begin=function(){baseBegin();message.textContent='Lumen Ark의 마지막 신호를 따라 네뷸라를 통과하라.';showStory(storyBeats[0][1],storyBeats[0][2]);};over=function(){baseOver();title.textContent='Signal Lost';message.textContent='Lumen Ark의 신호는 다시 어둠 속으로 사라졌다. 하지만 기록은 남았다.';showStory('FINAL TRANSMISSION','구조 신호가 끊겼다. 다음 파일럿은 이 기록을 찾게 될 것이다.');};
let lastBeat=-1;setInterval(()=>{if(!s.play)return;for(let i=storyBeats.length-1;i>=0;i--){if(s.t>=storyBeats[i][0]&&lastBeat<i){lastBeat=i;showStory(storyBeats[i][1],storyBeats[i][2]);break}}},500);const oldBegin=begin;begin=function(){lastBeat=-1;oldBegin()};
</script>

<script>

<script>
/* Mission progression layer: three phases and a survival objective. */
const phaseStyle=document.createElement('style');phaseStyle.textContent='.phase-badge{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:7px 13px;border:1px solid #7beeff33;border-radius:99px;background:#080d26bb;color:#aeefff;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;backdrop-filter:blur(9px);z-index:3}.phase-badge em{color:#ff9fe0;font-style:normal;margin-left:7px}';document.head.appendChild(phaseStyle);
const phaseBadge=document.createElement('div');phaseBadge.className='phase-badge';app.appendChild(phaseBadge);let missionWon=false;
const missionBegin=begin;begin=function(){missionWon=false;phaseBadge.style.display='block';missionBegin()};
function completeMission(){if(missionWon)return;missionWon=true;s.play=false;phaseBadge.style.display='none';title.textContent='Mission Complete';message.textContent='Lumen Ark의 구조 신호를 확보했다. 네뷸라를 탈출하라.';start.textContent='REPLAY MISSION';overlay.classList.remove('hidden');showStory('LUMEN ARK / RECOVERED','신호의 발신자는 아직 살아 있다. 다음 좌표가 잠금 해제됐다.')}
setInterval(()=>{if(!s.play)return;const t=s.t;if(t>=90){completeMission();return}let label='PHASE 01 / ENTRY',detail='debris field';if(t>=55){label='PHASE 03 / THE VEIL';detail='unknown signal'}else if(t>=25){label='PHASE 02 / CONTACT';detail='hostile trajectory'}phaseBadge.innerHTML=label+'<em>'+detail+'</em>'},250);
</script>
<script>const missionOver=over;over=function(){phaseBadge.style.display='none';missionOver()};</script></body></html>
